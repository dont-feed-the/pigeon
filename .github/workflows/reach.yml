# M3's reach scenario (roadmap; 09 §9.5, ADR 0016): on the Linux runner a
# laptop and its backup machine create a group and invite the person Mac,
# whose laptop is the macOS runner, on another network, with no address in
# common; each side's file reaches the other through n0's relays and
# address lookup (scripts/reach-pair). The two jobs meet through this run's
# artifacts: the inviter uploads the invitation, which the joiner polls
# for, and says when Mac's file has arrived. Both also run tests/relay.rs.
name: reach

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: reach-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_ANNEX_VERSION: "10.20261006"
  GIT_ANNEX_SHA256: 88ea73c9bb8fb751916e0e4a0a8f489a7476f9b9e861fd2cce2601a77f4f409d
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  inviter:
    name: inviter (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cached git-annex build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/git-annex-dist
          key: git-annex-standalone-${{ env.GIT_ANNEX_SHA256 }}
      - name: git-annex, standalone build at the pinned checksum
        run: |
          mkdir -p ~/.cache/git-annex-dist
          t=~/.cache/git-annex-dist/git-annex-standalone-amd64.tar.gz
          [ -f "$t" ] || curl -fsSL -o "$t" \
            https://downloads.kitenet.net/git-annex/linux/current/git-annex-standalone-amd64.tar.gz
          echo "$GIT_ANNEX_SHA256  $t" | sha256sum -c - || {
            echo "::error::upstream moved past git-annex $GIT_ANNEX_VERSION; move the pin deliberately"
            rm -f "$t"; exit 1; }
          tar -C ~ -xzf "$t"
          echo ~/git-annex.linux >> "$GITHUB_PATH"
      - name: pigeon's git-annex, once git-annex.yml has built this patch set (ADR 0069)
        uses: ./.github/actions/git-annex-pigeon
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: reach-ubuntu-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: reach-ubuntu-
      - name: the pinned toolchain (rust-toolchain.toml)
        run: (rustup toolchain install || cargo --version) && rustup show active-toolchain
      - name: pigeond, pigeon and the transport helper
        run: cargo build --locked --release -p pigeond -p pigeon -p git-annex-p2p-iroh
      - name: two endpoints find each other by device ID (tests/relay.rs)
        env:
          PIGEON_NET_TESTS: "1"
        run: cargo test --locked --release -p pigeond --test relay
      - name: the group, and an invitation for Mac
        run: scripts/reach-pair target/release "$RUNNER_TEMP/reach" inviter-start "$RUNNER_TEMP/invitation.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: invitation
          path: ${{ runner.temp }}/invitation.txt
      - name: Mac's file arrives
        env:
          PIGEON_REACH_WAIT: "2700"
        run: |
          scripts/reach-pair target/release "$RUNNER_TEMP/reach" inviter-wait
          echo "ubuntu has Mac's file" > "$RUNNER_TEMP/done.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reach-done
          path: ${{ runner.temp }}/done.txt
      - name: stop the daemons
        if: always()
        run: scripts/reach-pair target/release "$RUNNER_TEMP/reach" stop || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reach-logs-ubuntu
          path: |
            ${{ runner.temp }}/reach/*/pigeond.log
            ${{ runner.temp }}/reach/*/h/state/logs
          if-no-files-found: ignore

  joiner:
    name: joiner (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: git-annex from Homebrew
        run: brew install git-annex
      - name: pigeon's git-annex, once git-annex.yml has built this patch set (ADR 0069)
        uses: ./.github/actions/git-annex-pigeon
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: reach-macos-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: reach-macos-
      - name: the pinned toolchain (rust-toolchain.toml)
        run: (rustup toolchain install || cargo --version) && rustup show active-toolchain
      - name: pigeond, pigeon and the transport helper
        run: cargo build --locked --release -p pigeond -p pigeon -p git-annex-p2p-iroh
      - name: two endpoints find each other by device ID (tests/relay.rs)
        env:
          PIGEON_NET_TESTS: "1"
        run: cargo test --locked --release -p pigeond --test relay
      - name: the inviter's invitation, once it is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/reach-artifact invitation "$RUNNER_TEMP" 2700
      - name: Mac joins and gets the inviter's file, then writes its own
        env:
          PIGEON_REACH_WAIT: "900"
        run: scripts/reach-pair target/release "$RUNNER_TEMP/reach" joiner "$RUNNER_TEMP/invitation.txt"
      - name: the inviter has Mac's file
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/reach-artifact reach-done "$RUNNER_TEMP" 900
      - name: stop the daemon
        if: always()
        run: scripts/reach-pair target/release "$RUNNER_TEMP/reach" stop || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reach-logs-macos
          path: |
            ${{ runner.temp }}/reach/*/pigeond.log
            ${{ runner.temp }}/reach/*/h/state/logs
          if-no-files-found: ignore
