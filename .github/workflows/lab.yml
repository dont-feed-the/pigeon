# Every lab experiment that asserts, run against real git and git-annex on
# Linux and macOS (ADR 0026, issue #10), in four groups that run in parallel:
# E20 E21 E22 (file-system objects, disaster drill, repositories on one disk
# and capacity; E22 mounts a tmpfs with the runner's sudo),
# E12-E13 E14 E23 (the P2P boundary, purge, the verified drop over P2P),
# E15 E15b E18 E24 (freeing folders, unprotected versions, what a hide
# and a drop may lose or show) and E19 (install
# races). Linux uses git-annex's standalone build, pinned by checksum, so a
# new upstream release fails here until the pin is moved deliberately (spec 14
# §14.3); macOS uses Homebrew's current git-annex, whose version the log
# records.
# The optional native_zfs_only dispatch builds one real filesystem fixture;
# ordinary publication/PR lab groups stay Rust-free and unchanged.
name: lab

on:
  # Quick and Rust-free: part of the pull-request tier.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_call:
    inputs:
      platform:
        description: macos for periodic background validation; Linux for publication
        type: string
        default: linux
  workflow_dispatch:
    inputs:
      native_reference_only:
        description: Measure the actual 100000-file, 50GB, two-peer reference budgets
        type: boolean
        default: false
      reference_prepare_seconds:
        description: "Reference preparation limit: 600 for diagnosis, 5400 for the complete attempt"
        type: choice
        options: ["5400", "600"]
        default: "5400"
      reference_fast_preparation:
        description: Fast seeding then Gentle sampling, diagnostic only and never a budget pass
        type: boolean
        default: false
      native_zfs_only:
        description: Run only the disposable native Linux ZFS backup fixture
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: lab-${{ github.ref }}-${{ inputs.platform || 'linux' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GIT_ANNEX_VERSION: "10.20261006"
  GIT_ANNEX_SHA256: 88ea73c9bb8fb751916e0e4a0a8f489a7476f9b9e861fd2cce2601a77f4f409d
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
    with:
      force-full: ${{ inputs.platform == 'macos' }}

  lab:
    needs: changes
    if: needs.changes.outputs.lab == 'true' && !inputs.native_zfs_only && !inputs.native_reference_only
    name: ${{ matrix.group }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'macos' && '["macos-latest"]' || '["ubuntu-24.04"]') }}
        group: [E20 E21 E22, E12-E13 E14 E23, E15 E15b E18 E24, E19]
      max-parallel: ${{ inputs.platform == 'macos' && 2 || 4 }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cached git-annex build (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/git-annex-dist
          key: git-annex-standalone-${{ env.GIT_ANNEX_SHA256 }}
      - name: git-annex, standalone build at the pinned checksum (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.cache/git-annex-dist
          t=~/.cache/git-annex-dist/git-annex-standalone-amd64.tar.gz
          [ -f "$t" ] || curl -fsSL -o "$t" \
            https://downloads.kitenet.net/git-annex/linux/current/git-annex-standalone-amd64.tar.gz
          echo "$GIT_ANNEX_SHA256  $t" | sha256sum -c - || {
            echo "::error::upstream moved past git-annex $GIT_ANNEX_VERSION; move the pin deliberately"
            rm -f "$t"; exit 1; }
          tar -C ~ -xzf "$t"
          echo ~/git-annex.linux >> "$GITHUB_PATH"
      - name: git-annex from Homebrew (macOS)
        if: runner.os == 'macOS'
        run: brew install git-annex
      - name: versions
        run: git annex version && git --version && python3 --version && bash --version | head -1 && uname -a
      - name: E20, file-system objects
        if: matrix.group == 'E20 E21 E22'
        run: python3 lab/git-annex/ga-e20-filesystem-objects.py
      - name: strace, to count git-annex's fsync calls in E21 (Linux)
        if: matrix.group == 'E20 E21 E22' && runner.os == 'Linux'
        run: command -v strace || { sudo apt-get update -qq && sudo apt-get install -y -qq strace; }
      - name: E21, disaster drill
        if: matrix.group == 'E20 E21 E22'
        run: python3 lab/git-annex/ga-e21-disaster-drill.py
      - name: E22, repositories on one disk and capacity
        if: matrix.group == 'E20 E21 E22'
        run: python3 lab/git-annex/ga-e22-capacity.py
      - name: E12 and E13, the P2P boundary
        if: matrix.group == 'E12-E13 E14 E23'
        run: python3 lab/git-annex/ga-e12-e13-p2p-boundary.py
      - name: E14, purge by references
        if: matrix.group == 'E12-E13 E14 E23'
        run: python3 lab/git-annex/ga-e14-purge.py
      - name: E23, the verified drop over P2P
        if: matrix.group == 'E12-E13 E14 E23'
        run: python3 lab/git-annex/ga-e23-p2p-drop.py
      - name: E15, freeing a folder with sparse checkout
        if: matrix.group == 'E15 E15b E18 E24'
        run: bash lab/git-annex/ga-e15-sparse-folders.sh
      - name: E15b, no pointer file while freeing and keeping
        if: matrix.group == 'E15 E15b E18 E24'
        run: bash lab/git-annex/ga-e15b-pointer-free-transitions.sh
      - name: E18, unprotected versions offline
        if: matrix.group == 'E15 E15b E18 E24'
        run: bash lab/git-annex/ga-e18-unprotected-versions.sh
      - name: E24, what a hide and a drop may lose or show
        if: matrix.group == 'E15 E15b E18 E24'
        run: python3 lab/git-annex/ga-e24-evict-boundaries.py
      - name: E19, install against racing saves
        if: matrix.group == 'E19'
        run: python3 lab/git-annex/ga-e19-install-races.py

  selected-checks:
    name: Lab selection verified
    if: ${{ !cancelled() && !inputs.native_zfs_only && !inputs.native_reference_only }}
    needs: [changes, lab]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: selected jobs succeeded and only explicit exclusions were skipped
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/select-ci --verify lab

  native-zfs:
    name: real ZFS backup admission and persisted objects
    if: inputs.native_zfs_only && !inputs.native_reference_only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIGEON_REQUIRE_GIT_ANNEX: 1
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bridge-annex
      - uses: ./.github/actions/git-annex-pigeon
        with:
          required: "true"
      - name: actual kernel and native ZFS tools
        run: |
          set -e
          uname -a
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zfsutils-linux
          sudo modprobe zfs
          modinfo -F version zfs
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps/*.rlib
            target/debug/deps/*.rmeta
            target/debug/deps/*.so
            target/debug/deps/*.dylib
            target/debug/deps/*.d
            target/.rustc_info.json
            !target/debug/deps/libpigeon*
            !target/debug/deps/libgit_annex_p2p_iroh*
            !target/debug/.fingerprint/pigeon*/**
            !target/debug/.fingerprint/git-annex-p2p-iroh*/**
            !target/debug/build/pigeon*/**
            !target/debug/build/git-annex-p2p-iroh*/**
          key: rust-lab-deps-v1-ubuntu-24.04-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-lab-deps-v1-ubuntu-24.04-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: crates/pigeon-web/client/.nvmrc
          cache: npm
          cache-dependency-path: crates/pigeon-web/client/package-lock.json
      - name: the pinned Rust toolchain
        run: (rustup toolchain install || cargo --version) && rustup show active-toolchain
      - uses: ./.github/actions/nextest
      - name: native programs and explicit ZFS fixture
        run: |
          set -e
          export TMPDIR="$RUNNER_TEMP/pigeon-zfs-tests"
          mkdir -p "$TMPDIR"
          cargo build --locked -p pigeon -p pigeond -p git-annex-p2p-iroh --features pigeond/lab
          scripts/check-zfs
      - name: retain failed synthetic ZFS metadata and daemon logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-native-zfs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pigeon-zfs-tests
            ${{ runner.temp }}/pigeon-zfs-failure-*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  native-reference:
    name: ${{ inputs.reference_fast_preparation && 'diagnostic Fast preparation, Gentle window (not qualification)' || '100000 files, 50GB, two real peers, ten-minute resource window' }}
    if: inputs.native_reference_only
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: retain an explicit unmeasured verdict during native setup
        run: |
          printf '{"budget_verdict":"not-measured","stage":"native setup","source":"%s","samples":[]}\n' \
            "$GITHUB_SHA" > "$RUNNER_TEMP/reference-budget.json"
      - uses: ./.github/actions/bridge-annex
      - uses: ./.github/actions/git-annex-pigeon
        with:
          required: "true"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: crates/pigeon-web/client/.nvmrc
          cache: npm
          cache-dependency-path: crates/pigeon-web/client/package-lock.json
      - name: native measurement tools and production programs
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends btrfs-progs btrfs-compsize
          rustup toolchain install
          cargo build --release --locked -p pigeon -p pigeond -p git-annex-p2p-iroh
          uname -a
          git annex version --raw
          systemd --version | head -1
      - name: real reference preparation and measured resource budgets
        env:
          PREPARE_SECONDS: ${{ inputs.reference_prepare_seconds || '5400' }}
          FAST_PREPARATION: ${{ inputs.reference_fast_preparation || 'false' }}
        run: |
          extra=()
          if [[ "$FAST_PREPARATION" == true ]]; then extra+=(--diagnostic-fast-prepare); fi
          scripts/check-reference-budget "$RUNNER_TEMP/reference-budget.json" \
            --prepare-seconds "$PREPARE_SECONDS" "${extra[@]}"
      - name: retain measurement, including failed and unmeasured verdicts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reference-budget.json
          if-no-files-found: error
          retention-days: 30
