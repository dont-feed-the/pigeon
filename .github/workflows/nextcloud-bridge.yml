# Exercise the bridge with real native peers and the Nextcloud command client.
# Shared-storage checks cover both an existing laptop and a custodian, including
# per-client identities, retained versions, in-place saves and provider loss.
name: nextcloud-bridge

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextcloud-bridge-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GIT_ANNEX_VERSION: "10.20261006"
  GIT_ANNEX_SHA256: 88ea73c9bb8fb751916e0e4a0a8f489a7476f9b9e861fd2cce2601a77f4f409d
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  bridge-build:
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    name: matching bridge binaries (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bridge-annex
      - name: restore main's Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps/*.rlib
            target/debug/deps/*.rmeta
            target/debug/deps/*.so
            target/debug/deps/*.dylib
            target/debug/deps/*.d
            target/.rustc_info.json
          key: rust-deps-v2-ubuntu-24.04-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-deps-v2-ubuntu-24.04-
      - name: Node, which builds the web interface's script (ADR 0077)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: crates/pigeon-web/client/.nvmrc
          cache: npm
          cache-dependency-path: crates/pigeon-web/client/package-lock.json
      - name: the pinned toolchain (rust-toolchain.toml)
        run: (rustup toolchain install || cargo --version) && rustup show active-toolchain
      - uses: ./.github/actions/nextest
      - name: matching bridge, daemon, CLI and transport binaries
        run: |
          cargo build --locked -p pigeon-bridge -p pigeond -p pigeon -p git-annex-p2p-iroh \
            --features pigeond/lab,pigeon-bridge/tla-trace
      - name: decisions arriving before their proposals do not freeze later edits
        run: cargo nextest run --locked -p pigeond --features lab --test decision_retry
      - name: bundle this run's matching native programs
        run: |
          mkdir -p "$RUNNER_TEMP/bridge-native"
          tar -C target/debug -czf "$RUNNER_TEMP/bridge-native/programs.tar.gz" \
            pigeon-bridge pigeond pigeon git-annex-p2p-iroh
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/bridge-native/source"
          (cd "$RUNNER_TEMP/bridge-native" && sha256sum programs.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridge-native-${{ github.run_id }}
          path: ${{ runner.temp }}/bridge-native
          compression-level: 0
          overwrite: true
      - name: save the Rust cache (main only)
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps/*.rlib
            target/debug/deps/*.rmeta
            target/debug/deps/*.so
            target/debug/deps/*.dylib
            target/debug/deps/*.d
            target/.rustc_info.json
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}


  bridge:
    needs: [changes, bridge-build]
    if: needs.changes.outputs.bridge == 'true'
    name: Nextcloud bridge (${{ matrix.case }}, ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case: [laptop, custodian, nextcloud]
    env:
      NEXTCLOUDCMD: nextcloudcmd
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bridge-annex
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: bridge-native-${{ github.run_id }}
          path: ${{ runner.temp }}/bridge-native
      - name: verify the immutable source and restore executable permissions
        run: |
          a="$RUNNER_TEMP/bridge-native"
          test "$(cat "$a/source")" = "$GITHUB_SHA"
          (cd "$a" && sha256sum -c SHA256SUMS)
          mkdir -p target/debug
          tar -C target/debug -xzf "$a/programs.tar.gz"
      - name: the real Nextcloud command client
        if: matrix.case == 'nextcloud'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nextcloud-desktop-cmd
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.case == 'custodian'
        with:
          distribution: temurin
          java-version: "21"
      - name: share an existing laptop's storage
        if: matrix.case == 'laptop'
        run: python3 scripts/check-nextcloud-shared-storage --provider laptop
      - name: share an existing custodian's storage
        if: matrix.case == 'custodian'
        id: shared-custodian
        env:
          PIGEON_TRACE: "1"
          PIGEON_TRACE_DIR: ${{ runner.temp }}/bridge-system-traces
        run: python3 scripts/check-nextcloud-shared-storage --provider custodian --out "/tmp/pgc-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: check real multi-peer identity and DAV transaction observations
        if: matrix.case == 'custodian' && steps.shared-custodian.outcome == 'success'
        run: |
          python3 scripts/check-bridge-lifecycle-traces "${{ runner.temp }}/bridge-system-traces"
          python3 scripts/check-bridge-sync-traces "${{ runner.temp }}/bridge-system-traces"
      - name: retain the failed custodian fixture and its native traces
        if: failure() && matrix.case == 'custodian'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-bridge-custodian-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            /tmp/pgc-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/bridge-system-traces
          retention-days: 14
          if-no-files-found: warn
      - name: portal, WebDAV and real Nextcloud synchronization
        if: matrix.case == 'nextcloud'
        run: python3 scripts/check-nextcloud-bridge

  catalogue-traces:
    needs: changes
    if: needs.changes.outputs.bridge_traces == 'true'
    name: bridge catalogue observations checked by TLC
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-ubuntu-24.04-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-ubuntu-24.04-
      - name: Node, which builds the web interface's script (ADR 0077)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: crates/pigeon-web/client/.nvmrc
          cache: npm
          cache-dependency-path: crates/pigeon-web/client/package-lock.json
      - name: the pinned toolchain
        run: (rustup toolchain install || cargo --version) && rustup show active-toolchain
      - name: real RPC pages, concurrent reads, bounded retries and corrupted observations
        run: python3 scripts/check-bridge-catalogue-traces
      - name: persisted identities, queued revocation and corrupted observations
        run: python3 scripts/check-bridge-lifecycle-traces
      - name: conditional saves, uncertain responses and corrupted observations
        run: python3 scripts/check-bridge-sync-traces

  selected-checks:
    name: Bridge selection verified
    if: ${{ !cancelled() }}
    needs: [changes, bridge-build, bridge, catalogue-traces]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: selected jobs succeeded and only explicit exclusions were skipped
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/select-ci --verify bridge
