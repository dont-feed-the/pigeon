# Exercise the bridge with real native peers and the Nextcloud command client.
# Shared-storage checks cover both an existing laptop and a custodian, including
# per-client identities, retained versions, in-place saves and provider loss.
name: nextcloud-bridge

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextcloud-bridge-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  bridge:
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    name: Nextcloud bridge (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GIT_ANNEX_VERSION: "10.20261006"
      GIT_ANNEX_SHA256: 88ea73c9bb8fb751916e0e4a0a8f489a7476f9b9e861fd2cce2601a77f4f409d
      NEXTCLOUDCMD: nextcloudcmd
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/git-annex-dist
          key: git-annex-standalone-${{ env.GIT_ANNEX_SHA256 }}
      - name: git-annex at the repository's pinned checksum
        run: |
          mkdir -p ~/.cache/git-annex-dist
          t=~/.cache/git-annex-dist/git-annex-standalone-amd64.tar.gz
          [ -f "$t" ] || curl -fsSL -o "$t" \
            https://downloads.kitenet.net/git-annex/linux/current/git-annex-standalone-amd64.tar.gz
          echo "$GIT_ANNEX_SHA256  $t" | sha256sum -c - || {
            echo "::error::upstream moved past git-annex $GIT_ANNEX_VERSION; move the pin deliberately"
            rm -f "$t"; exit 1; }
          tar -C ~ -xzf "$t"
          echo ~/git-annex.linux >> "$GITHUB_PATH"
      - name: the real Nextcloud command client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nextcloud-desktop-cmd
      - name: restore main's Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-ubuntu-24.04-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-ubuntu-24.04-
      - name: the pinned toolchain (rust-toolchain.toml)
        run: (rustup toolchain install || cargo --version) && rustup show active-toolchain
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: matching bridge, daemon, CLI and transport binaries
        id: build
        run: |
          cargo build --locked -p pigeon-bridge -p pigeond -p pigeon -p git-annex-p2p-iroh \
            --features pigeond/lab,pigeon-bridge/tla-trace
      - name: share an existing laptop's storage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/check-nextcloud-shared-storage --provider laptop
      - name: decisions arriving before their proposals do not freeze later edits
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --locked -p pigeond --features lab --test decision_retry
      - name: share an existing custodian's storage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: shared-custodian
        env:
          PIGEON_TRACE: "1"
          PIGEON_TRACE_DIR: ${{ runner.temp }}/bridge-system-traces
        run: python3 scripts/check-nextcloud-shared-storage --provider custodian
      - name: check real multi-peer identity and DAV transaction observations
        if: ${{ !cancelled() && steps.shared-custodian.outcome == 'success' }}
        run: |
          python3 scripts/check-bridge-lifecycle-traces "${{ runner.temp }}/bridge-system-traces"
          python3 scripts/check-bridge-sync-traces "${{ runner.temp }}/bridge-system-traces"
      - name: portal, WebDAV and real Nextcloud synchronization
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/check-nextcloud-bridge
      - name: save the Rust cache (main only)
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  catalogue-traces:
    needs: changes
    if: needs.changes.outputs.bridge_traces == 'true'
    name: bridge catalogue observations checked by TLC
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-ubuntu-24.04-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-ubuntu-24.04-
      - name: the pinned toolchain
        run: (rustup toolchain install || cargo --version) && rustup show active-toolchain
      - name: real RPC pages, concurrent reads, bounded retries and corrupted observations
        run: python3 scripts/check-bridge-catalogue-traces
      - name: persisted identities, queued revocation and corrupted observations
        run: python3 scripts/check-bridge-lifecycle-traces
      - name: conditional saves, uncertain responses and corrupted observations
        run: python3 scripts/check-bridge-sync-traces

  selected-checks:
    name: Bridge selection verified
    if: ${{ !cancelled() }}
    needs: [changes, bridge, catalogue-traces]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: selected jobs succeeded and only explicit exclusions were skipped
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/select-ci --verify bridge
