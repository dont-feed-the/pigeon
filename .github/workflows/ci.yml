# Checks of main and release-tag pushes and pull requests: repository rules,
# the fast TLA+ models with their expected verdicts (ADR 0026), the catalogue model on
# every schedule of its cases (spec 05 §5.2), the Rust workspace on Linux (and
# macOS on tags, 14 §14.6), and runs of pigeon-core checked by TLC (ADR 0008, 13 §13.13).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  repository:
    name: repository rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: files under 1000 lines, source files with a header
        run: scripts/check-file-length-and-header
      - name: ADR index matches the ADR files
        run: scripts/check-adr-index
      - name: every cited section of the spec exists
        run: scripts/check-spec-refs
      - name: E25 stock hang budget and patched trial count
        run: python3 -B -m unittest discover -s lab/git-annex/tests

  catalogue:
    name: catalogue model
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: every schedule keeps the merge laws; the old rules fail as expected
        run: python3 models/catalogue/catalogue.py

  models:
    name: TLA+ models (fast set)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pigeon
          key: tla2tools-${{ hashFiles('scripts/run-tlc') }}
      - name: trace logs become TLA+ modules (spec 13 §13.3)
        run: scripts/trace-to-tla --check
      - name: every configuration gives its expected verdict
        run: scripts/run-tlc

  rust:
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '["ubuntu-24.04", "macos-latest"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GIT_ANNEX_VERSION: "10.20261006"
      GIT_ANNEX_SHA256: 88ea73c9bb8fb751916e0e4a0a8f489a7476f9b9e861fd2cce2601a77f4f409d
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      PIGEON_REQUIRE_GIT_ANNEX: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cached git-annex build (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/git-annex-dist
          key: git-annex-standalone-${{ env.GIT_ANNEX_SHA256 }}
      - name: git-annex, standalone build at the pinned checksum (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.cache/git-annex-dist
          t=~/.cache/git-annex-dist/git-annex-standalone-amd64.tar.gz
          [ -f "$t" ] || curl -fsSL -o "$t" \
            https://downloads.kitenet.net/git-annex/linux/current/git-annex-standalone-amd64.tar.gz
          echo "$GIT_ANNEX_SHA256  $t" | sha256sum -c - || {
            echo "::error::upstream moved past git-annex $GIT_ANNEX_VERSION; move the pin deliberately"
            rm -f "$t"; exit 1; }
          tar -C ~ -xzf "$t"
          echo ~/git-annex.linux >> "$GITHUB_PATH"
      - name: git-annex from Homebrew (macOS)
        if: runner.os == 'macOS'
        run: brew install git-annex
      - name: versions
        run: git annex version | head -1 && git --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-${{ matrix.os }}-
      - name: the pinned toolchain (rust-toolchain.toml)
        run: (rustup toolchain install || cargo --version) && rustup show active-toolchain
      - name: formatted with rustfmt
        run: cargo fmt --all --check
      - name: clippy without warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: tests, laws and the git-annex contract tests (13 §13.6)
        run: cargo test --workspace --locked --no-fail-fast
      - name: the format fixtures, golden and next-format files (ADR 0048, 13 §13.6)
        run: cargo test -p pigeond --test formats --locked
      - name: the lab build's seams (13 §13.12)
        run: cargo test -p pigeon-sys --features lab --locked
      - name: the first build of the slice, and pigeond's other daemons-on-one-host tests (13 §13.12)
        run: |
          cargo build -p pigeon -p git-annex-p2p-iroh --locked
          cargo test -p pigeond --features lab --locked --tests
      - name: licences, advisories and sources (cargo deny, ADR 0019)
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - name: pigeon-core depends on no crate that does I/O (14 §14.6)
        run: scripts/check-core-deps
      - name: pigeon-core with its trace events (feature tla-trace, 12 §12.3)
        run: |
          cargo clippy -p pigeon-core --all-targets --features tla-trace --locked -- -D warnings
          # Keep feature-specific tests on both platforms; the workspace already
          # runs the full core suite. code-traces also checks these logs with TLC.
          cargo test -p pigeon-core --features tla-trace --locked \
            --test trace --test roster_trace --test admit_trace \
            --test authority_trace --test catalogue_trace

  code-traces:
    name: runs of pigeon-core checked by TLC
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pigeon
          key: tla2tools-${{ hashFiles('scripts/run-tlc') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-traces-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-traces-
      - name: the pinned toolchain (rust-toolchain.toml)
        run: (rustup toolchain install || cargo --version) && rustup show active-toolchain
      - name: every run is accepted by its model, every mutant rejected (13 §13.3)
        run: scripts/check-code-traces --seeds 20
