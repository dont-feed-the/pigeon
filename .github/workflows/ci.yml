# Checks of main and release-tag pushes and pull requests: repository rules,
# the fast TLA+ models with their expected verdicts (ADR 0026) in three shards,
# the catalogue model on every schedule of its cases (spec 05 §5.2), the Rust
# workspace on Linux (macOS runs periodically, 14 §14.6), pigeond's
# daemons-on-one-host tests in four shards, and runs of pigeon-core checked by
# TLC (ADR 0008, 13 §13.13). This is the pull-request tier and should finish
# in about ten minutes; lab.yml joins it, slice.yml runs on main and tags,
# models-full.yml and the S9 crash schedules on tags and nightly.
#
# Caches are saved from main only: a pull request restores main's cache and
# keeps its own build, so pull requests no longer evict main's caches.
# macos-background.yml reuses these jobs periodically without gating releases.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_call:
    inputs:
      platform:
        description: macos for periodic background validation; Linux for publication
        type: string
        default: linux

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.platform || 'linux' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Smaller caches and faster links: no incremental state, line tables only.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
    with:
      force-full: ${{ inputs.platform == 'macos' }}

  proofs:
    needs: changes
    if: inputs.platform != 'macos' && needs.changes.outputs.proofs == 'true'
    uses: ./.github/workflows/proofs.yml

  repository:
    if: inputs.platform != 'macos'
    name: repository rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: files under 1000 lines, source files with a header
        run: scripts/check-file-length-and-header
      - name: ADR index matches the ADR files
        run: scripts/check-adr-index
      - name: every cited section of the spec exists
        run: scripts/check-spec-refs
      - name: dependency archive verification
        run: python3 -B -m unittest discover -s scripts/tests
      - name: E25 stock hang budget and patched trial count
        run: python3 -B -m unittest discover -s lab/git-annex/tests

  catalogue:
    needs: changes
    if: inputs.platform != 'macos' && needs.changes.outputs.catalogue == 'true'
    name: catalogue model
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: every schedule keeps the merge laws; the old rules fail as expected
        run: python3 models/catalogue/catalogue.py

  packaging:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    name: install, rollback and uninstall (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'macos' && '["macos-latest"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: checked archives, supervisor configuration and preserved user data
        run: python3 -B -m unittest discover -s packaging/tests -v
      - name: retain failed native Mac supervisor observations
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-native-macos-priority-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pigeon-macos-priority
          if-no-files-found: ignore
          retention-days: 14
      - name: native presets restart under systemd and children inherit CPU and I/O priority
        if: runner.os == 'Linux'
        run: |
          set -e
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          scripts/check-native-priority

  models:
    needs: [changes, proofs]
    if: ${{ !cancelled() && inputs.platform != 'macos' && needs.changes.outputs.models == 'true' && needs.proofs.result == 'success' }}
    name: TLA+ models (fast set, shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pigeon
          key: tla2tools-${{ hashFiles('scripts/run-tlc') }}
      - name: trace logs become TLA+ modules (spec 13 §13.3)
        if: matrix.shard == 0
        run: scripts/trace-to-tla --check
      - name: every configuration gives its expected verdict
        run: scripts/run-tlc --shard ${{ matrix.shard }} 3

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'macos' && '["macos-latest"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GIT_ANNEX_VERSION: "10.20261006"
      GIT_ANNEX_SHA256: 88ea73c9bb8fb751916e0e4a0a8f489a7476f9b9e861fd2cce2601a77f4f409d
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      PIGEON_REQUIRE_GIT_ANNEX: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cached git-annex build (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/git-annex-dist
          key: git-annex-standalone-${{ env.GIT_ANNEX_SHA256 }}
      - name: git-annex, standalone build at the pinned checksum (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.cache/git-annex-dist
          t=~/.cache/git-annex-dist/git-annex-standalone-amd64.tar.gz
          [ -f "$t" ] || curl -fsSL -o "$t" \
            https://downloads.kitenet.net/git-annex/linux/current/git-annex-standalone-amd64.tar.gz
          echo "$GIT_ANNEX_SHA256  $t" | sha256sum -c - || {
            echo "::error::upstream moved past git-annex $GIT_ANNEX_VERSION; move the pin deliberately"
            rm -f "$t"; exit 1; }
          tar -C ~ -xzf "$t"
          echo ~/git-annex.linux >> "$GITHUB_PATH"
      - name: git-annex from Homebrew (macOS)
        if: runner.os == 'macOS'
        run: brew install git-annex
      - name: pigeon's patched git-annex and the system git (ADR 0069)
        uses: ./.github/actions/git-annex-pigeon
        with:
          required: "true"
      - name: versions
        run: git annex version | head -1 && git --version
      - name: restore main's Rust cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps/*.rlib
            target/debug/deps/*.rmeta
            target/debug/deps/*.so
            target/debug/deps/*.dylib
            target/debug/deps/*.d
            target/.rustc_info.json
          key: rust-deps-v2-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-deps-v2-${{ matrix.os }}-
      - name: Node, which builds the web interface's script (ADR 0077)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: crates/pigeon-web/client/.nvmrc
          cache: npm
          cache-dependency-path: crates/pigeon-web/client/package-lock.json
      - name: the pinned toolchain (rust-toolchain.toml)
        run: (rustup toolchain install || cargo --version) && rustup show active-toolchain
      - name: cargo-nextest at its pinned version
        uses: ./.github/actions/nextest
      - name: formatted with rustfmt
        run: cargo fmt --all --check
      - name: clippy without warnings
        run: cargo clippy --workspace --all-targets --features pigeond/tokio-console --locked -- -D warnings
      - name: tests, laws and the git-annex contract tests (13 §13.6)
        run: cargo nextest run --workspace --locked
      - name: doc tests, which nextest does not run
        run: cargo test --workspace --locked --doc
      - name: relay discovery and transfers on Linux
        if: runner.os == 'Linux'
        env:
          PIGEON_NET_TESTS: "1"
        run: cargo test -p pigeond --test relay --locked
      - name: the format fixtures, golden and next-format files (ADR 0048, 13 §13.6)
        run: cargo test -p pigeond --test formats --locked
      - name: licences, advisories and sources (cargo deny, ADR 0019)
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - name: pigeon-core depends on no crate that does I/O (14 §14.6)
        run: scripts/check-core-deps
      - name: axe-core over the mockups and the real pages (10 §10.3)
        if: runner.os == 'Linux'
        run: scripts/check-a11y
      - name: pigeon-core with its trace events (feature tla-trace, 12 §12.3)
        run: |
          cargo clippy -p pigeon-core --all-targets --features tla-trace --locked -- -D warnings
          # Keep feature-specific tests on both platforms; the workspace already
          # runs the full core suite. code-traces also checks these logs with TLC.
          cargo test -p pigeon-core --features tla-trace --locked \
            --test trace --test roster_trace --test admit_trace \
            --test authority_trace --test catalogue_trace
      - name: save the Rust cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps/*.rlib
            target/debug/deps/*.rmeta
            target/debug/deps/*.so
            target/debug/deps/*.dylib
            target/debug/deps/*.d
            target/.rustc_info.json
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # pigeond's daemons-on-one-host tests (feature lab, 13 §13.12) took 24 of
  # the Rust job's 35 minutes when cargo ran them one binary after another.
  # Each shard builds them all, from the same cache, and runs about six
  # minutes of them; shard 3 also checks the real storage boundaries with TLC.
  daemons:
    needs: changes
    if: needs.changes.outputs.daemons == 'true'
    name: pigeond's daemons on one host (${{ matrix.os }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'macos' && '["macos-latest"]' || '["ubuntu-24.04"]') }}
        shard: [0, 1, 2, 3]
      max-parallel: ${{ inputs.platform == 'macos' && 2 || 4 }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GIT_ANNEX_VERSION: "10.20261006"
      GIT_ANNEX_SHA256: 88ea73c9bb8fb751916e0e4a0a8f489a7476f9b9e861fd2cce2601a77f4f409d
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      PIGEON_REQUIRE_GIT_ANNEX: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cached git-annex build (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/git-annex-dist
          key: git-annex-standalone-${{ env.GIT_ANNEX_SHA256 }}
      - name: git-annex, standalone build at the pinned checksum (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.cache/git-annex-dist
          t=~/.cache/git-annex-dist/git-annex-standalone-amd64.tar.gz
          [ -f "$t" ] || curl -fsSL -o "$t" \
            https://downloads.kitenet.net/git-annex/linux/current/git-annex-standalone-amd64.tar.gz
          echo "$GIT_ANNEX_SHA256  $t" | sha256sum -c - || {
            echo "::error::upstream moved past git-annex $GIT_ANNEX_VERSION; move the pin deliberately"
            rm -f "$t"; exit 1; }
          tar -C ~ -xzf "$t"
          echo ~/git-annex.linux >> "$GITHUB_PATH"
      - name: git-annex from Homebrew (macOS)
        if: runner.os == 'macOS'
        run: brew install git-annex
      - name: pigeon's patched git-annex and the system git (ADR 0069)
        uses: ./.github/actions/git-annex-pigeon
        with:
          required: "true"
      - name: versions
        run: git annex version | head -1 && git --version
      - name: restore main's Rust cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-lab-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-lab-${{ matrix.os }}-
      - name: Node, which builds the web interface's script (ADR 0077)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: crates/pigeon-web/client/.nvmrc
          cache: npm
          cache-dependency-path: crates/pigeon-web/client/package-lock.json
      - name: the pinned toolchain (rust-toolchain.toml)
        run: (rustup toolchain install || cargo --version) && rustup show active-toolchain
      - name: cargo-nextest at its pinned version
        uses: ./.github/actions/nextest
      - name: the first build of the slice, and the lab build's seams (13 §13.12)
        run: |
          cargo build -p pigeon -p git-annex-p2p-iroh --locked
          cargo test -p pigeond --features lab --locked --tests --no-run
          cargo test -p pigeon-sys --features lab --locked
      - name: this shard's daemons-on-one-host tests
        env:
          SHARD: ${{ matrix.shard }}
          # Where a failed test keeps its directory, uploaded below.
          TMPDIR: ${{ runner.temp }}/pigeon-tests
        # The lab tests of pigeond are the test files that start with
        # `#![cfg(feature = "lab")]`. nextest deals them out across the four
        # shards one test at a time (`slice`, not `count`, which splits each
        # test file on its own), so each runs in exactly one, and runs a
        # shard's tests in parallel: they must pass under that load. The
        # word splitting of `$lab` needs bash.
        shell: bash
        run: |
          mkdir -p "$TMPDIR"
          lab=$(grep -l '^#!\[cfg(feature = "lab")\]' crates/pigeond/tests/*.rs | xargs -n1 basename | sed 's/\.rs$//')
          filter=$(printf 'binary(=%s) | ' $lab)
          cargo nextest run -p pigeond --features lab --locked \
            --partition "slice:$((SHARD + 1))/4" -E "${filter% | }"
      - name: native supported-filesystem fixtures (14 §14.2)
        if: runner.os == 'Linux' && matrix.shard == 0
        run: |
          if ! command -v mkfs.btrfs >/dev/null || ! command -v mkfs.xfs >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends btrfs-progs xfsprogs
          fi
          scripts/check-filesystems
      - name: the directories of failed tests, with each daemon's full logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-daemon-tests-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/pigeon-tests
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.shard == 3
        with:
          distribution: temurin
          java-version: "21"
      - name: real storage boundaries pass TLC and every corrupted observation fails
        if: matrix.shard == 3
        run: python3 scripts/check-storage-traces
      - name: save the Rust cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' && matrix.shard == 0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  code-traces:
    needs: changes
    if: inputs.platform != 'macos' && needs.changes.outputs.code_traces == 'true'
    name: runs of pigeon-core checked by TLC
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pigeon
          key: tla2tools-${{ hashFiles('scripts/run-tlc') }}
      - name: restore main's Rust cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-traces-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-traces-
      - name: the pinned toolchain (rust-toolchain.toml)
        run: (rustup toolchain install || cargo --version) && rustup show active-toolchain
      - uses: ./.github/actions/nextest
      - name: every run is accepted by its model, every mutant rejected (13 §13.3)
        run: scripts/check-code-traces --seeds 20
      - name: save the Rust cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  driver-traces:
    needs: changes
    if: inputs.platform != 'macos' && needs.changes.outputs.driver_traces == 'true'
    name: daemon observations checked by TLC
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pigeon's patched git-annex and the system git (ADR 0069)
        uses: ./.github/actions/git-annex-pigeon
        with:
          required: "true"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-driver-traces-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-driver-traces-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pigeon
          key: tla2tools-${{ hashFiles('scripts/run-tlc') }}
      - name: Node, which builds the web interface's script (ADR 0077)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: crates/pigeon-web/client/.nvmrc
          cache: npm
          cache-dependency-path: crates/pigeon-web/client/package-lock.json
      - name: the pinned toolchain (rust-toolchain.toml)
        run: (rustup toolchain install || cargo --version) && rustup show active-toolchain
      - name: observations and every semantic, schema and pipeline mutant
        run: python3 scripts/check-driver-traces
      - name: cargo-nextest at its pinned version
        uses: ./.github/actions/nextest
      - name: real purge/restore partitions, physical drops, and rejected trace mutants
        run: python3 scripts/check-purge-traces
      - name: trace workers and eager witnesses preserve verdicts and coverage failures
        run: python3 -B -m unittest discover -s models/tests -v
      - name: save the Rust cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-driver-traces-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

  selected-checks:
    name: CI selection verified
    if: ${{ !cancelled() && inputs.platform != 'macos' }}
    needs: [changes, repository, proofs, catalogue, packaging, models, rust, daemons, code-traces, driver-traces]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: selected jobs succeeded and only explicit exclusions were skipped
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/select-ci --verify
