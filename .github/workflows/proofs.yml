# Fresh parameterized proofs when their inputs change; identical inputs may
# reuse successful main verification. Scheduled/manual/release checks stay fresh.
name: TLA+ proofs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  safety:
    name: TLAPS safety and proof mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cache identity and provenance cannot hide changed formal inputs
        run: python3 -B -m unittest discover -s scripts/tests -p test_proof_inputs.py
      - name: fingerprint source paths, contents, configurations and tool pins
        id: inputs
        run: echo "hash=$(python3 scripts/proof-inputs)" >> "$GITHUB_OUTPUT"
      - name: restore successful main verification for exactly these inputs
        id: verified
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/formal-proofs
          key: verified-tla-v1-${{ steps.inputs.outputs.hash }}
      - name: validate and cite the main run that checked identical inputs
        if: steps.verified.outputs.cache-hit == 'true'
        run: python3 scripts/proof-inputs --verify
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.verified.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.verified.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/pigeon
          key: formal-tools-linux-x64-${{ hashFiles('scripts/check-proofs', 'scripts/run-tlc') }}
          restore-keys: formal-tools-linux-x64-
      - name: fresh proofs, actual cfg assumptions, and rejected mutations
        id: proof
        if: steps.verified.outputs.cache-hit != 'true'
        run: scripts/check-proofs
      - name: record provenance only after successful fresh verification
        if: steps.proof.outcome == 'success'
        run: python3 scripts/proof-inputs --record
      - name: save successful verification from main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.proof.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/formal-proofs
          key: verified-tla-v1-${{ steps.inputs.outputs.hash }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tlaps-proofs-${{ github.workflow }}
          path: target/formal-proofs
          if-no-files-found: error
