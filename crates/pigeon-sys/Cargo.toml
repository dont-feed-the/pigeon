[package]
name = "pigeon-sys"
description = "The platform layer: renames, signals, fadvise, probes and sockets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The seams of the lab build (13 §13.12): named crash points and a root for a
# backup machine's system directories. A release build never enables it.
lab = []

[dependencies]
dirs.workspace = true
libc.workspace = true
rustix.workspace = true
thiserror.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
core-foundation.workspace = true
system-configuration-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
