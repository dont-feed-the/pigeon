pigeon-web.workspace = true
quick-xml.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "fs", "signal"] }
