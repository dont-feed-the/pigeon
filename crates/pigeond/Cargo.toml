[package]
name = "pigeond"
description = "The pigeon daemon: its loops, the iroh endpoint and the local socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The lab build (13 §13.12): named crash points and a backup machine's root.
lab = ["pigeon-sys/lab"]
# Trace events for checking runs against TLA+ (12 §12.3, ADR 0008).
tla-trace = ["pigeon-core/tla-trace"]
# ADR 0025: opt-in task inspection in debug builds only.
tokio-console = ["pigeon-telemetry/tokio-console", "tokio/tracing"]

[dependencies]
pigeon-core.workspace = true
pigeon-git.workspace = true
pigeon-proto.workspace = true
pigeon-telemetry.workspace = true
pigeon-sys.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
axum.workspace = true
pigeon-web.workspace = true
pigeon-i18n.workspace = true
iroh.workspace = true
iroh-mdns-address-lookup.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "fs", "signal"] }
toml_edit.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
futures-util.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
notify-rust.workspace = true

[dev-dependencies]
hegeltest.workspace = true

[lints]
workspace = true
