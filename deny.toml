# cargo deny: every dependency's licence is compatible with MIT OR Apache-2.0
# (ADR 0019), no crate has a known advisory, and crates come from crates.io
# only. Run in CI's rust job (spec 14 §14.6).
[graph]
all-features = true
# The platforms pigeon is built for (ADR 0005); wasm-only crates of iroh's
# relay client, under the Unlicense, are not built (14 §14.8).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
ignore = [
    # Unmaintained, not vulnerable: a proc macro of netlink-packet-core,
    # which iroh's netwatch uses on Linux (14 §14.8).
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained proc macro under iroh's netwatch" },
]
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# option-ext, under dirs-sys and dirs (ADR 0036): MPL-2.0 is file-level
# copyleft, so pigeon's own files keep their licence; its source stays
# available on crates.io (14 §14.8).
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Mozilla's root certificates as data, through iroh's reqwest (14 §14.8).
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# Native change hints (ADR 0013): notify 8.2 dedicates its code under CC0,
# with a permissive fallback licence; compatible with MIT OR Apache-2.0.
# Keep this exception specific to notify rather than allowing it globally.
[[licenses.exceptions]]
crate = "notify"
allow = ["CC0-1.0"]
