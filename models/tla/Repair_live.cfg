\* Repair (13 §13.2), liveness: under the fairness of FairSpec (transfers,
\* syncs, scrubs, heals; admins remove lost custodians and add the joiner) and
\* with room for K copies of everything, an endangered key gets K domains back.
SPECIFICATION FairSpec
CONSTANTS
  Cust = {1, 2, 3}
  Joiners = {3}
  Dom <- OwnDisks
  Room <- RoomAmple
  Rank <- RankAB
  K = 2
  Keys = {"a", "b"}
  Start = {1, 2}
  OnCust = {"a"}
  OnLaptop = {"b"}
  Restored = FALSE
  MaxFaults = 1
  MaxEnv = 1
  Off = {}
CONSTRAINT CapacityHolds
PROPERTY Restores
CHECK_DEADLOCK FALSE
