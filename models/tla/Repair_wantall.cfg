\* Negative (13 §13.2): Repair_live4 with "wantroom" off: domain repair counts
\* every member of the share, even one at its reserve, as taking the key, so
\* nobody repairs it. Must fail.
SPECIFICATION FairSpec
CONSTANTS
  Cust = {1, 2, 3, 4}
  Joiners = {3}
  Dom <- OwnDisks
  Room <- RoomNone3
  Rank <- RankA4
  K = 2
  Keys = {"a"}
  Start = {1, 2}
  OnCust = {"a"}
  OnLaptop = {}
  Restored = FALSE
  MaxFaults = 1
  MaxEnv = 1
  Off = {"wantroom"}
CONSTRAINT CapacityHolds
PROPERTY Restores
CHECK_DEADLOCK FALSE
