\* Repair (13 §13.2): 2 custodians hold key a, the joiner 3 has room for one
\* key, the laptop holds key b; faults, crashes, partitions; every safeguard.
SPECIFICATION Spec
CONSTANTS
  Cust = {1, 2, 3}
  Joiners = {3}
  Room <- RoomTight
  Rank <- RankAB
  K = 2
  Keys = {"a", "b"}
  Start = {1, 2}
  OnCust = {"a"}
  OnLaptop = {"b"}
  Restored = TRUE
  MaxFaults = 2
  MaxEnv = 1
  Off = {}
INVARIANT TypeOK
INVARIANT Survival
INVARIANT ReserveKept
INVARIANT EndangeredFirst
PROPERTY INV_K
CHECK_DEADLOCK FALSE
