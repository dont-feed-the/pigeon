\* Repair (13 §13.2), liveness with four custodians and one key: the joiner 3
\* is at its reserve, yet sizebalanced ranks it first for the key; domain
\* repair counts only members that can take the key, so 4 repairs it.
SPECIFICATION FairSpec
CONSTANTS
  Cust = {1, 2, 3, 4}
  Joiners = {3}
  Room <- RoomNone3
  Rank <- RankA4
  K = 2
  Keys = {"a"}
  Start = {1, 2}
  OnCust = {"a"}
  OnLaptop = {}
  Restored = FALSE
  MaxFaults = 1
  MaxEnv = 1
  Off = {}
CONSTRAINT CapacityHolds
PROPERTY Restores
CHECK_DEADLOCK FALSE
