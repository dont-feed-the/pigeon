\* Liveness: devices that keep fetching and merging converge, the removed laptop signing on old parents.
CONSTANTS PathSet = {"f", "r"}
          OwnedPaths = {"f"}
          ConcreteNames = FALSE
          MaxCommits = 2
          MaxHostile = 1
          Hostile = TRUE
          Ops = {"merge", "fetch", "remove", "hcommit"}
          Revocation = "revoke"
          DecidersAt = "decision"
          ForceAdopt = TRUE
          DecisionMerge = TRUE
          Rule3 = "every"
          BaseOf = "accepted"
          DecisionRule = "deciders"
SPECIFICATION Live
PROPERTY Converge
CHECK_DEADLOCK FALSE
