# The pigeon v2 workspace (14 §14.6, spec 14 §14.6). Each crate pins its
# dependencies here, one minor version each (14 §14.7).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.50"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dont-feed-the/pigeon"
publish = false

[workspace.dependencies]
pigeon-core = { path = "crates/pigeon-core" }
pigeon-proto = { path = "crates/pigeon-proto" }
pigeon-i18n = { path = "crates/pigeon-i18n" }
pigeon-git = { path = "crates/pigeon-git" }
pigeon-sys = { path = "crates/pigeon-sys" }
pigeon-lab = { path = "crates/pigeon-lab" }
pigeon-web = { path = "crates/pigeon-web" }
pigeon-telemetry = { path = "crates/pigeon-telemetry" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "form"] }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "error-context"] }
clap_complete = { version = "4.6", default-features = false, features = ["unstable-dynamic"] }
argon2 = "0.5"
base64 = "0.22"
httpdate = "1.0"
percent-encoding = "2.3"
quick-xml = "0.42"
subtle = "2.6"
url = "2.5"
data-encoding = "2.11"
dirs = "7.0"
fluent-bundle = "0.16"
fluent-langneg = "0.13"
fluent-syntax = "0.12"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
form_urlencoded = "1"
getrandom = "0.4"
maud = "0.27"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
libc = "0.2"
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
notify-rust = { version = "4.18", default-features = false }
rustix = { version = "1.1", features = ["fs", "mm", "process", "stdio", "system"] }
# The computer name of macOS (09 §9.6); reqwest links both frameworks already.
core-foundation = "0.10"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo"] }
block2 = "0.6.2"
zbus = { version = "6.0", default-features = false, features = ["tokio", "proxy"] }
system-configuration-sys = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
# Portable names (05 §5.4): the Unicode 16.0 tables, pinned; changing them
# is a format change (issue #15).
caseless = "=0.2.2"
unicode-normalization = "=0.1.24"
tempfile = "3.27"
thiserror = "2.0"
toml_edit = { version = "0.25", features = ["serde"] }
tokio = { version = "1.53", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tower = { version = "0.5", default-features = false, features = ["util"] }
unic-langid = "0.9"
hegeltest = "0.49"
# ADR 0025: only pigeon-telemetry consumes the OpenTelemetry dependencies.
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "with-serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
console-subscriber = { version = "=0.5.0", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std", "fmt", "env-filter"] }
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = "0.6"
# SSHSIG commit signatures (ADR 0007); the release candidate that shares
# iroh's ed25519-dalek 3 and sha2 0.11.
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["alloc", "ed25519"] }

# Development only: the laws of ADR 0012.

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
panic = "abort"

# Development builds keep file and line numbers for backtraces, without the
# full debug info that made each test binary about 400 MB; dependencies
# carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Keep development signature laws practical without reducing their cases.
# The same crypto is optimized in release builds; local code stays debug.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# Development portal sign-in uses release-style code generation for the same
# password algorithm and work factors; application code stays in debug mode.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
